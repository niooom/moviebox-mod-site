name: Build and publish landing page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # publishing to a branch needs no manual Pages setup: the built site can be served
      # straight from the branch, and if Pages is switched on later (Source: Deploy from a
      # branch -> gh-pages) the same content appears at https://<owner>.github.io/<repo>/
      - name: Publish build to gh-pages
        run: |
          set -euo pipefail
          cd dist
          touch .nojekyll
          git init -q
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add -A
          git commit -qm "build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
          echo "published to the gh-pages branch"
